name: Deploy Portfolio to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Deploy to Oracle Cloud via SSH & Rsync
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 $USER@$HOST "sudo chown -R $USER:$USER /var/www/html"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" out/ $USER@$HOST:/var/www/html/
          ssh -o StrictHostKeyChecking=no $USER@$HOST "sudo chmod -R 755 /var/www/html && sudo systemctl reload nginx || true"
